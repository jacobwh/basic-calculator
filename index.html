<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(101, 84, 255, 0.25), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(22, 197, 166, 0.18), transparent 34%),
        #0b0e17;
    }

    .calculator {
      width: min(100%, 370px);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      background: rgba(24, 28, 42, 0.88);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(18px);
    }

    .title {
      margin: 0 0 20px 4px;
      color: #aeb5ca;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .display {
      min-height: 112px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 16px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .expression {
      min-height: 24px;
      color: #81899f;
      font-size: 0.95rem;
    }

    .result {
      width: 100%;
      overflow: hidden;
      color: #f7f8fc;
      font-size: clamp(2.4rem, 12vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      aspect-ratio: 1;
      border: 0;
      border-radius: 18px;
      color: #f6f7fb;
      background: #282d3e;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { filter: brightness(1.16); }
    button:active { transform: scale(0.94); }
    button:focus-visible { outline: 3px solid #8b7dff; outline-offset: 2px; }

    .utility { color: #bfc5d6; background: #34394b; }
    .operator { color: #ffffff; background: #6554ff; }
    .equals { background: #18b99c; }
    .zero { grid-column: span 2; aspect-ratio: auto; text-align: left; padding-left: 29px; }

    @media (max-width: 400px) {
      body { padding: 14px; }
      .calculator { padding: 18px; border-radius: 24px; }
      .keys { gap: 9px; }
      button { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <p class="title">Calculator</p>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <div class="keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="sign">±</button>
      <button class="utility" data-action="percent">%</button>
      <button class="operator" data-action="operator" data-value="÷">÷</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="×">×</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="−">−</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button class="zero" data-action="number" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const result = document.querySelector('#result');
    const expression = document.querySelector('#expression');
    const keys = document.querySelector('.keys');

    let current = '0';
    let previous = null;
    let operator = null;
    let waitingForOperand = false;

    function format(value) {
      if (!Number.isFinite(value)) return 'Error';
      return Number.parseFloat(value.toPrecision(12)).toString();
    }

    function updateDisplay() {
      result.textContent = current;
      expression.textContent = previous !== null && operator
        ? `${previous} ${operator}`
        : '';
    }

    function inputNumber(number) {
      if (current === 'Error' || waitingForOperand) {
        current = number;
        waitingForOperand = false;
      } else if (current === '0') {
        current = number;
      } else if (current.replace('-', '').replace('.', '').length < 12) {
        current += number;
      }
    }

    function inputDecimal() {
      if (current === 'Error' || waitingForOperand) {
        current = '0.';
        waitingForOperand = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
    }

    function calculate(a, b, op) {
      if (op === '+') return a + b;
      if (op === '−') return a - b;
      if (op === '×') return a * b;
      if (op === '÷') return b === 0 ? NaN : a / b;
      return b;
    }

    function chooseOperator(nextOperator) {
      const input = Number.parseFloat(current);
      if (!Number.isFinite(input)) return clear();

      if (operator && previous !== null && !waitingForOperand) {
        const value = calculate(Number(previous), input, operator);
        current = format(value);
        previous = current === 'Error' ? null : current;
      } else {
        previous = current;
      }

      operator = current === 'Error' ? null : nextOperator;
      waitingForOperand = true;
    }

    function equals() {
      if (operator === null || previous === null || waitingForOperand) return;
      const fullExpression = `${previous} ${operator} ${current} =`;
      current = format(calculate(Number(previous), Number(current), operator));
      previous = null;
      operator = null;
      waitingForOperand = true;
      expression.textContent = fullExpression;
    }

    function clear() {
      current = '0';
      previous = null;
      operator = null;
      waitingForOperand = false;
    }

    function handleAction(action, value) {
      if (action === 'number') inputNumber(value);
      if (action === 'decimal') inputDecimal();
      if (action === 'operator') chooseOperator(value);
      if (action === 'equals') equals();
      if (action === 'clear') clear();
      if (action === 'sign' && current !== '0' && current !== 'Error') current = current.startsWith('-') ? current.slice(1) : `-${current}`;
      if (action === 'percent' && current !== 'Error') current = format(Number(current) / 100);
      updateDisplay();
    }

    keys.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (button) handleAction(button.dataset.action, button.dataset.value);
    });

    document.addEventListener('keydown', (event) => {
      const keyMap = { '/': '÷', '*': '×', '-': '−', '+': '+' };
      if (/^[0-9]$/.test(event.key)) handleAction('number', event.key);
      else if (event.key === '.') handleAction('decimal');
      else if (event.key in keyMap) handleAction('operator', keyMap[event.key]);
      else if (event.key === 'Enter' || event.key === '=') handleAction('equals');
      else if (event.key === 'Escape') handleAction('clear');
      else if (event.key === 'Backspace' && !waitingForOperand) {
        current = current.length > 1 ? current.slice(0, -1) : '0';
        updateDisplay();
      } else return;
      event.preventDefault();
    });
  </script>
</body>
</html>
